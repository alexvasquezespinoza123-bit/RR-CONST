<section class="carrusel-container" aria-label="Galería de proyectos de construcción">
  <img [src]="imagenes()[indiceActual()]" alt="Proyecto de construcción de RR Constructiva" />
  <div class="carousel-controls">
    <button type="button" aria-label="Imagen anterior" (click)="anterior()">‹</button>
    <button type="button" aria-label="Imagen siguiente" (click)="siguiente()">›</button>
  </div>
  <div class="carousel-dots" aria-label="Seleccionar imagen">
    <button *ngFor="let imagen of imagenes(); let i = index" type="button" [class.active]="i === indiceActual()" [attr.aria-label]="'Ver imagen ' + (i + 1)" (click)="irA(i)"></button>
  </div>
</section>
