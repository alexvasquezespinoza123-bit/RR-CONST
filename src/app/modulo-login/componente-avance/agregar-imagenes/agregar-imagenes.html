<div class="m-4 space-y-6">
  <!-- DATOS DEL USUARIO -->
  <fieldset class="border-2 border-[#004080] rounded-lg p-6 relative">
    <legend class="text-2xl font-bold px-2 text-[#004080]">DATOS DEL USUARIO:</legend>
    <div class="flex flex-col mt-2">
      <label class="text-sm font-semibold mb-1 text-gray-700">USUARIO:</label>
      <select [(ngModel)]="idUsuario"
              class="border border-gray-300 rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-[#004080]">
        <option [ngValue]="null" disabled>Seleccione un usuario</option>
        <option *ngFor="let u of usuarios" [ngValue]="u.idusuario">
          {{ u.nombreusuario }} {{ u.apellidosusuario }}
        </option>
      </select>
    </div>
  </fieldset>

  <!-- DATOS DEL AVANCE -->
  <fieldset class="border-2 border-[#004080] rounded-lg p-6 relative">
    <legend class="text-2xl font-bold px-2 text-[#004080]">DATOS DEL AVANCE:</legend>
    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
      <div class="flex flex-col">
        <label class="text-sm font-semibold mb-1 text-gray-700">IMAGEN (EXISTENTE):</label>
        <select [(ngModel)]="rutaImagen"
                class="border border-gray-300 rounded-md px-3 py-2 bg-white focus:outline-none focus:ring-2 focus:ring-[#004080]">
          <option *ngFor="let r of imagenesDisponibles" [value]="r">{{ r }}</option>
        </select>
      </div>
      <div class="flex flex-col">
        <label class="text-sm font-semibold mb-1 text-gray-700">O SUBIR UNA IMAGEN:</label>
        <input type="file" accept="image/*" (change)="subirArchivo($event)"
               class="border border-gray-300 rounded-md px-3 py-2 bg-white">
      </div>
      <div class="flex flex-col">
        <label class="text-sm font-semibold mb-1 text-gray-700">FECHA:</label>
        <input type="date" [(ngModel)]="fecha"
               class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
      </div>
      <div class="flex flex-col">
        <label class="text-sm font-semibold mb-1 text-gray-700">PORCENTAJE AVANCE (0-100):</label>
        <input type="number" min="0" max="100" [(ngModel)]="porcentaje"
               class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
      </div>
      <div class="flex flex-col md:col-span-2">
        <label class="text-sm font-semibold mb-1 text-gray-700">DESCRIPCIÓN:</label>
        <input type="text" [(ngModel)]="descripcion"
               class="border border-gray-300 rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-[#004080]">
      </div>
    </div>

    <div class="mt-4">
      <p class="text-sm font-semibold text-gray-700 mb-1">VISTA PREVIA:</p>
      <img [src]="rutaImagen" class="h-40 rounded-md border" alt="Vista previa">
    </div>
  </fieldset>

  <!-- BOTONES -->
  <div class="flex justify-end items-center space-x-4 pt-2">
    <p *ngIf="mensaje" class="font-semibold"
       [ngClass]="{ 'text-green-600': tipoMensaje === 'exito', 'text-red-600': tipoMensaje === 'error' }">
      {{ mensaje }}
    </p>
    <button (click)="limpiar()" class="bg-gray-400 text-white font-bold px-4 py-2 rounded-lg cursor-pointer">LIMPIAR</button>
    <button (click)="guardar()" class="bg-green-500 text-white font-bold px-4 py-2 rounded-lg cursor-pointer">GUARDAR</button>
  </div>
</div>
