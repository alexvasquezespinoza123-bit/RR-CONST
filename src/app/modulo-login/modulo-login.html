<section>
  <div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="bg-white shadow-lg rounded-lg p-8 w-full max-w-sm">
      <h2 class="text-2xl font-bold text-center mb-2">Acceso al sistema</h2>
      <p class="text-center text-gray-500 mb-6">Panel de seguimiento de proyectos</p>
      <div class="mb-4">
        <label class="block text-gray-700 mb-2">Usuario</label>
        <input
          type="text"
          [(ngModel)]="nombreLogin"
          (keyup.enter)="login()"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 border-blue-700 shadow-blue-300"
          placeholder="Correo electrónico"
        >
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Contraseña</label>
        <input
          type="password"
          [(ngModel)]="constrasena"
          (keyup.enter)="login()"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 border-blue-700 shadow-blue-300"
          placeholder="Contraseña"
        />
      </div>
      <div class="mb-6">
        <label class="block text-gray-700 mb-2">Rol</label>
        <select
          [(ngModel)]="rol"
          class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-1 focus:ring-blue-500 border-blue-700 shadow-blue-300 bg-white"
        >
          <option value="admin">Administrador</option>
          <option value="user">Usuario</option>
        </select>
      </div>
      <button
        (click)="login()"
        class="w-full bg-blue-500 text-white py-2 rounded-lg hover:bg-blue-600 transition-colors cursor-pointer"
      >
        Ingresar
      </button>
      <p *ngIf="mensaje"
         class="mt-4 text-center font-semibold"
         [ngClass]="{
           'text-green-600': tipoMensaje === 'exito',
           'text-red-600': tipoMensaje === 'error'
         }"
      >{{ mensaje }}</p>
    </div>
  </div>
<p class="mt-5 text-xs text-center text-gray-500">Acceso de demostración local. Cambia las credenciales antes de publicar el sistema.</p>
  </section>
